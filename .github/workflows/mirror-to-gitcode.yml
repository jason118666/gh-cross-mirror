name: Mirror to GitCode

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "仅预览（不建仓、不推送）；取消勾选后正式执行"
        type: boolean
        default: true

permissions:
  # 仅使用内置令牌，在控制仓库的 mirror-state 分支保存同步进度。
  contents: write

concurrency:
  group: mirror-to-gitcode
  cancel-in-progress: false

jobs:
  mirror:
    # 配置完成后将 ENABLE_SYNC 设为 true，才开启定时写入。
    if: github.event_name == 'workflow_dispatch' || vars.ENABLE_SYNC == 'true'
    # 固定系统版本，避免 ubuntu-latest 升级时改变运行环境。
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Run offline checks
        run: python -m unittest discover -s tests -v
      - name: Scan and sync repositories
        env:
          GH_OWNER: ${{ vars.GH_OWNER || github.repository_owner }}
          GITHUB_TOKEN: ${{ github.token }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GC_TOKEN: ${{ secrets.GC_TOKEN }}
          GC_NAMESPACE: ${{ vars.GC_NAMESPACE || secrets.GC_NAMESPACE }}
          INCLUDE_PRIVATE: ${{ vars.INCLUDE_PRIVATE || 'false' }}
          REPO_ALLOWLIST: ${{ vars.REPO_ALLOWLIST }}
          REPO_EXCLUDE: ${{ vars.REPO_EXCLUDE }}
          MAX_NEW_REPOS: ${{ vars.MAX_NEW_REPOS || '10' }}
          MAX_SYNC_REPOS: ${{ vars.MAX_SYNC_REPOS || '200' }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
        run: python scripts/mirror_to_gitcode.py
