name: Mirror to GitCode

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests pygithub

      - name: Run mirror script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GC_TOKEN: ${{ secrets.GC_TOKEN }}
          GC_NAMESPACE: ${{ secrets.GC_NAMESPACE }}
        run: python .github/scripts/mirror_to_gitcode.py
