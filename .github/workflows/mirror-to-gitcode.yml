name: Auto mirror forks to GitCode
on:
  schedule:
    - cron: "0 */6 * * *"  # 每6小时扫描一次，可以自己改
  workflow_dispatch: # 支持手动点按钮立刻跑

jobs:
  scan-and-mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install requests pygithub
      - name: Run mirror script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GC_TOKEN: ${{ secrets.GC_TOKEN }}
          GC_NAMESPACE: ${{ secrets.GC_NAMESPACE }}
        run: |
          python - <<END
import os
import requests
from github import Github

gh = Github(os.getenv("GITHUB_TOKEN"))
gc_token = os.getenv("GC_TOKEN")
gc_ns = os.getenv("GC_NAMESPACE")
gc_api = "https://api.gitcode.com/api/v5"
headers_gc = {}

# 遍历你名下所有仓库（包含fork）
for repo in gh.get_user().get_repos():
    repo_name = repo.name
    gh_url = repo.clone_url
    # 查询GitCode是否已经存在同名仓库
    r = requests.get(f"{gc_api}/repos/{gc_ns}/{repo_name}", params={"access_token": gc_token})
    if r.status_code == 404:
        print(f"[+] GitCode不存在，新建仓库：{repo_name}")
        # 调用GitCode API新建仓库，同时导入GitHub地址，自动开启GitCode的Pull镜像
        create_data = {
            "name": repo_name,
            "private": False,
            "import_url": gh_url
        }
        res = requests.post(f"{gc_api}/user/repos", params={"access_token": gc_token}, json=create_data)
        if res.status_code == 201:
            print(f"✅ {repo_name} 创建成功，GitCode自动拉取镜像已开启")
        else:
            print(f"❌ 创建失败 {repo_name}: {res.text}")
    else:
        print(f"跳过，仓库已存在：{repo_name}")
END
